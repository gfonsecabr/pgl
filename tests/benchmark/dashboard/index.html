<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Pangolin · benchmarks</title>
<link rel="stylesheet" href="style.css"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body data-page="pairs">
<header class="topbar">
  <div class="brand">
    <a href="../index.html" class="logo-link"><img src="logo.png" alt="Pangolin" class="logo"/></a>
    <a href="../index.html">Pangolin</a><span>benchmarks</span>
  </div>
  <div class="controls">
    <nav class="benchmark-nav" aria-label="Benchmark category">
      <a class="nav-button active" href="index.html" aria-current="page">Pairs</a>
      <a class="nav-button" href="asymptotic.html">Asymptotic</a>
    </nav>
    <label class="depth-picker" title="How many recent recorded runs to show and compare. At least 2 runs are used so the current score can be compared with history.">History
      <input id="depth" type="number" min="2" max="20" step="1" value="5"/>
    </label>
    <label class="machine-picker">Machine
      <select id="machine"></select>
    </label>
  </div>
</header>

<!-- One multi-select chip group per cube dimension. The two highest-priority
     dimensions that still have >1 value selected become the table columns and
     rows; any further multi-valued dimensions facet into a grid of tables. -->
<section id="filters" class="filters"></section>

<div id="summary" class="summary"></div>
<main id="suites"><p class="empty-state">Loading benchmark data…</p></main>

<p id="generated" class="generated"></p>

<div id="spark-pop" role="tooltip"></div>

<dialog id="chart-dialog">
  <div class="dialog-head">
    <span id="chart-title"></span>
    <button id="chart-close" type="button" aria-label="Close">&times;</button>
  </div>
  <div class="dialog-body"><canvas id="chart-canvas"></canvas></div>
</dialog>

<script src="app.js"></script>
</body>
</html>
