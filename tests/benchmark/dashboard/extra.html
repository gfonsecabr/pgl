<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Pangolin · extra benchmarks</title>
<link rel="stylesheet" href="style.css"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body data-page="extra">
<header class="topbar">
  <div class="brand">
    <a href="../index.html" class="logo-link"><img src="logo.png" alt="Pangolin" class="logo"/></a>
    <a href="../index.html">Pangolin</a><span>benchmarks</span>
  </div>
  <div class="controls">
    <nav class="benchmark-nav" aria-label="Benchmark category">
      <a class="nav-button" href="index.html">Pairs</a>
      <a class="nav-button active" href="extra.html" aria-current="page">Extra benchmarks</a>
    </nav>
    <div class="legend"><span>best</span><i class="grad"></i><span>worst</span></div>
    <label class="machine-picker">Machine
      <select id="machine"></select>
    </label>
  </div>
</header>

<section id="extra-section" class="extra-section page-section">
  <h1 class="section-title">Whole-algorithm benchmarks</h1>
  <main id="extra"><p class="empty-state">Loading benchmark data…</p></main>
</section>

<p id="generated" class="generated"></p>

<div id="spark-pop" role="tooltip"></div>

<dialog id="chart-dialog">
  <div class="dialog-head">
    <span id="chart-title"></span>
    <button id="chart-close" type="button" aria-label="Close">&times;</button>
  </div>
  <div class="dialog-body"><canvas id="chart-canvas"></canvas></div>
</dialog>

<script src="app.js"></script>
</body>
</html>
